[supervisord]
nodaemon=true
user=root

[program:code-server]
command=/usr/bin/code-server --bind-addr 127.0.0.1:8080 --auth none --disable-telemetry /home/coder/workspace
user=coder
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ide-api]
command=/opt/ide/venv/bin/python /opt/ide/ide_api.py
directory=/opt/ide
user=coder
environment=PORT="8081"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /tmp/nginx.conf
user=root
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
