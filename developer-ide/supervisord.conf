[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:code-server]
command=/usr/bin/code-server --bind-addr 127.0.0.1:8080 --auth none --disable-telemetry --disable-update-check --user-data-dir /home/coder/.local/share/code-server /home/coder/workspace
user=coder
environment=HOME="/home/coder",USER="coder",XDG_CONFIG_HOME="/home/coder/.config",XDG_DATA_HOME="/home/coder/.local/share",XDG_CACHE_HOME="/home/coder/.cache"
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ide-api]
command=/opt/ide/venv/bin/python /opt/ide/ide_api.py
directory=/opt/ide
user=coder
environment=HOME="/home/coder",USER="coder",IDE_WORKSPACE_ROOT="/home/coder/workspace",IDE_BRIDGE_PORT="8081"
autostart=true
autorestart=true
startsecs=2
startretries=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /tmp/nginx.conf
user=root
autostart=true
autorestart=true
startsecs=2
startretries=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0