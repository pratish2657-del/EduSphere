[supervisord]
nodaemon=true

[program:code-server]
command=/usr/bin/code-server --bind-addr 127.0.0.1:8080 --auth none --disable-telemetry /home/coder/workspace
autorestart=true
priority=10

[program:ide-api]
command=/usr/local/bin/python /opt/ide/ide_api.py
directory=/opt/ide
environment=PORT="8081"
autorestart=true
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /opt/ide/nginx.conf
autorestart=true
priority=30
